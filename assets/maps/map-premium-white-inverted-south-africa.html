<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    background: #f4f4f1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
  }

  /* ── All styles scoped to .pmap wrapper ── */
  .pmap {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  .pmap__stage {
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: #f4f4f1;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.08);
  }

  .pmap__svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* inactive countries — faint, cool grey */
  .pmap__svg .c-off {
    fill: rgba(0,0,0,0.065);
    stroke: rgba(0,0,0,0.11);
    stroke-width: 0.4px;
    cursor: default;
  }

  /* ════════════════════════════════════
     highlighted countries — pearl/silver
     ════════════════════════════════════ */
  .pmap__svg .c-on {
    fill: rgba(255,255,255,0.92);
    stroke: rgba(0,0,0,0.20);
    stroke-width: 0.5px;
    cursor: default;
    transition: fill 0.4s ease, filter 0.4s ease;
  }

  .pmap__svg .c-on:hover {
    fill: rgba(255,255,255,1);
    filter: drop-shadow(0 0 8px rgba(0,0,0,0.16))
            drop-shadow(0 0 20px rgba(255,255,255,0.70));
  }

  .pmap__svg .c-mesh {
    fill: none;
    stroke: rgba(0,0,0,0.08);
    stroke-width: 0.25px;
    pointer-events: none;
  }

  .pmap__svg .c-grid {
    fill: none;
    stroke: rgba(0,0,0,0.035);
    stroke-width: 0.3px;
    pointer-events: none;
  }

  #pmap-status {
    color: rgba(0,0,0,0.28);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-align: center;
    padding: 80px 0;
    font-family: Helvetica, sans-serif;
  }

  @media (max-width: 600px) {
    .pmap { padding: 20px 10px; }
    .pmap__stage { border-radius: 12px; }
  }
</style>
</head>
<body>

<div class="pmap">
  <div class="pmap__stage" id="pmap-stage">
    <p id="pmap-status">Loading…</p>
  </div>
</div>

<!-- Full D3 bundle — much more reliable than sub-modules -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {

  /* ════════════════════════════════════════════════════
     EDIT HERE: add or remove country names to control
     which countries appear highlighted on the map.
     Names must match Natural Earth spelling exactly.
     ════════════════════════════════════════════════════ */
  const HIGHLIGHTED = new Set([
    'Lebanon',
    'Saudi Arabia',
    'Qatar',
    'Kuwait',
    'Netherlands',
    'Belgium',
    'Luxembourg',
    'France',
    'Switzerland',
    'Morocco',
    'Liberia',
    'Ghana',
    'Equatorial Guinea',
    'Nigeria',
    'South Africa',
  ]);



  function keepEuropeanFranceOnly(feature) {
    if (!feature || feature.properties.name !== 'France') return feature;
    if (!feature.geometry || feature.geometry.type !== 'MultiPolygon') return feature;

    const europeanPolygons = feature.geometry.coordinates.filter(polygon => {
      const points = polygon.flat();
      const avgLng = points.reduce((sum, point) => sum + point[0], 0) / points.length;
      const avgLat = points.reduce((sum, point) => sum + point[1], 0) / points.length;
      return avgLng > -10 && avgLng < 12 && avgLat > 40 && avgLat < 52;
    });

    return {
      ...feature,
      geometry: {
        ...feature.geometry,
        coordinates: europeanPolygons
      }
    };
  }

  const stage  = document.getElementById('pmap-stage');
  const status = document.getElementById('pmap-status');
  const W = 960, H = 500;

  const projection = d3.geoNaturalEarth1()
    .scale(155)
    .translate([W / 2, H / 2]);

  const pathGen = d3.geoPath().projection(projection);

  /* Create the SVG element */
  const svgEl = d3.select(stage)
    .append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('class', 'pmap__svg')
    .attr('aria-hidden', 'true');

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
    .then(r => {
      if (!r.ok) throw new Error('fetch failed');
      return r.json();
    })
    .then(world => {
      status.remove();

      const countries = topojson.feature(world, world.objects.countries);
      const mesh      = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

      /* sphere ocean */
      svgEl.append('path')
        .datum({ type: 'Sphere' })
        .attr('d', pathGen)
        .attr('fill', '#eeeeea');

      /* graticule grid */
      svgEl.append('path')
        .datum(d3.geoGraticule()())
        .attr('d', pathGen)
        .attr('class', 'c-grid');

      /* country fills */
      svgEl.selectAll('.country')
        .data(countries.features.map(keepEuropeanFranceOnly))
        .enter()
        .append('path')
        .attr('d', pathGen)
        .attr('class', d => HIGHLIGHTED.has(d.properties.name) ? 'c-on' : 'c-off');

      /* border mesh */
      svgEl.append('path')
        .datum(mesh)
        .attr('d', pathGen)
        .attr('class', 'c-mesh');
    })
    .catch(() => {
      status.textContent = 'Map unavailable — check network connection.';
    });

})();
</script>

</body>
</html>
